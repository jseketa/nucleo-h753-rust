# this file defines and specifies what the package is
[package]
# name of the package and of the default binary turns into _ in code
# limitations: must not start with a digit, because defmt turns it
# into Rust identifier
name = "nucleo-h753-rust"
# only matters when publishing to crates.io
version = "0.1.0"
# which Rust language edition to use
# current latest, as of 10/2026 is 2024
edition = "2024"

[dependencies]
# ROLE: access to cortex-m core peripherals (NVIC, SysTick, SCB) and
# CPU instructions (nop, wfi, bkpt) and interrupt::free
# C EQUIVALENT: CMSIS core (core_cm7.h, __NOP(), __disable_irq())
# FEATURE: inline-asm
# - nop(), wfi() and similar become one instruction each
# - no call into a precompiled library
# FEATURE: critical-section-single-core
# - supplies the "turn interrupts off" lock that defmt-rtt needs
# - only safe on a single core
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
# ROLE: vector table, reset handler, #[entry], linker script link.x
# C EQUIVALENT: startup_stm32h753xx.s and the .ld file
cortex-m-rt = "0.7.6"
# ROLE: logging macros (info!, warn!...)
# format strings stay on the PC, only an index and the values go over the wire
# C EQUIVALENT: printf, minus the format-string cost
defmt = "1.1.1"
# ROLE: carries defmt's bytes from the chip to the PC over RTT
# (a ring buffer in RAM that the probe reads through SWD)
defmt-rtt = "1.3.0"
# ROLE: what happens when the program panics
# print the message, then hit a breakpoint so probe-rs stops
# C EQUIVALENT: Hardfault_Handler() and while(1)
# FEATURE: print-defmt
# - panic-probe prints the panic message through defmt
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# [profile.dev] is used by plain cargo build / cargo run
[profile.dev]
# optimize for size
# level 0
# - the dev default, makes code several times bigger and slower
# - every register access becomes a function call
opt-level = "s"
# debug = 2, full debug info
# - debug info stays in the ELF on the PC
# - never flashed, so it costs no flash
debug = 2

# [profile.release] used with --release flag
[profile.release]
opt-level = "s"
debug = 2
# compile the crate as one unit
# better optimisation, but slower build
codegen-units = 1
